name: EduTrack CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────────
  # Job 1 : Analyse statique + Build Web (PWA)
  # ─────────────────────────────────────────────
  build-web:
    name: "🌐 Analyse & Build Web PWA"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installation de Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Installation des dépendances
        run: flutter pub get

      - name: Analyse statique du code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/utils/ lib/services/firestore_service.dart lib/models/

      - name: Build Web (PWA) Release
        run: flutter build web --release

      - name: Upload artefact Web
        uses: actions/upload-artifact@v4
        with:
          name: edutrack-web-release
          path: build/web

  # ─────────────────────────────────────────────
  # Job 2 : Build Android (APK + AppBundle) sur GitHub
  # ─────────────────────────────────────────────
  build-android:
    name: "🤖 Build Android (APK & AppBundle)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installation de Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Installation des dépendances
        run: flutter pub get

      - name: Build Android APK Release
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Build Android AppBundle Release
        run: flutter build appbundle --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload APK Android (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: edutrack-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AppBundle Android (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: edutrack-appbundle-release
          path: build/app/outputs/bundle/release/app-release.aab
